services:
  web:
    build: .
    image: findsmart-web:latest
    container_name: findsmart-app
    ports:
      - "3001:8000"
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    restart: always
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: findsmart-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data

volumes:
  redis_data:
