version: '3.8'

services:
  web:
    build: .
    image: findsmart-web:latest
    container_name: findsmart-app
    ports:
      - "3000:8000" # Mapea el puerto 3000 para que Nginx Proxy Manager lo vea
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    restart: always
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: findsmart-redis
    # ELIMINAMOS O COMENTAMOS LOS PORTS PARA EVITAR EL ERROR "PORT ALREADY ALLOCATED"
    # ports:
    #   - "6379:6379" 
    restart: unless-stopped
    volumes:
      - redis_data:/data

volumes:
  redis_data: